<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460">
  <defs>
    <linearGradient id="gradHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="gradBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="270" rx="180" ry="165" fill="#efe9fb"/>

  <!-- chip: checklist -->
  <g transform="translate(34,70)">
    <rect width="72" height="72" rx="18" fill="#ffffff" stroke="#e4e0f5" stroke-width="1.5"/>
    <path d="M18 37 l11 11 l25-25" stroke="#14b8a6" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- chip: calendar -->
  <g transform="translate(292,120)">
    <rect width="64" height="64" rx="16" fill="#ffffff" stroke="#e4e0f5" stroke-width="1.5"/>
    <rect x="14" y="18" width="36" height="30" rx="4" fill="none" stroke="#7c3aed" stroke-width="4"/>
    <line x1="14" y1="28" x2="50" y2="28" stroke="#7c3aed" stroke-width="4"/>
    <line x1="22" y1="12" x2="22" y2="22" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
    <line x1="42" y1="12" x2="42" y2="22" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- chip: graduation -->
  <g transform="translate(50,330)">
    <rect width="66" height="66" rx="16" fill="#ffffff" stroke="#e4e0f5" stroke-width="1.5"/>
    <path d="M33 20 L58 30 L33 40 L8 30 Z" fill="#14b8a6"/>
    <path d="M18 34 v10 c0 4 7 7 15 7 s15-3 15-7 v-10" fill="none" stroke="#14b8a6" stroke-width="3.5"/>
  </g>

  <!-- robot -->
  <g transform="translate(108,120)">
    <circle cx="92" cy="12" r="7" fill="#14b8a6"/>
    <rect x="88" y="18" width="8" height="18" rx="4" fill="#c9bdf0"/>

    <rect x="30" y="34" width="124" height="102" rx="32" fill="url(#gradHead)"/>
    <circle cx="66" cy="82" r="10" fill="#ffffff"/>
    <circle cx="118" cy="82" r="10" fill="#ffffff"/>
    <path d="M66 108 Q92 126 118 108" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>

    <rect x="10" y="158" width="42" height="18" rx="9" fill="url(#gradBody)"/>
    <rect x="132" y="158" width="42" height="18" rx="9" fill="url(#gradBody)"/>
    <rect x="46" y="146" width="92" height="112" rx="28" fill="url(#gradBody)"/>
    <rect x="76" y="180" width="32" height="10" rx="5" fill="rgba(255,255,255,.55)"/>
  </g>
</svg>
